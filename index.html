<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - IngressosFácil</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   
    <link rel="stylesheet" href="styles.css">
    
    <script src="cadastro.js" defer></script>
</head>
<body>

    <!-- Cabeçalho original do site -->
    <header>
        <div class="logo">
            <img src="./logo.png" alt="Logo do site">
            <h1>IngressosFácil</h1>
        </div>
                <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="pratica-css/eventos.html">Eventos</a></li>
            </ul>
        </nav>
    </header>

    <!-- Bloco principal com o formulário de cadastro -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-4">Criar conta</h1>
                        
                        <!-- Alerta -->
                        <div id="mensagem" class="alert alert-success" role="status" hidden></div>

                        <!-- Formulário -->
                        <form id="registerForm" method="POST" novalidate>
                            
                            <!-- Nome -->
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome completo</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                                    <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome" required>
                                    <div class="invalid-feedback" id="erro-nome"></div>
                                </div>
                            </div>

                            <!-- Telefone -->
                            <div class="mb-3">
                                <label for="telefone" class="form-label">Telefone</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-telephone" aria-hidden="true"></i></span>
                                    <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                                    <div class="invalid-feedback" id="erro-telefone"></div>
                                </div>
                            </div>

                            <!-- E-mail -->
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-envelope" aria-hidden="true"></i></span>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="voce@exemplo.com" required>
                                    <div class="invalid-feedback" id="erro-email"></div>
                                </div>
                                <div class="form-text">Nunca compartilhamos seu e-mail.</div>
                            </div>

                            <!-- Senha -->
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" required>
                                    <button type="button" class="btn btn-outline-secondary" id="ver-senha" aria-label="Mostrar senha">
                                        <i class="bi bi-eye" aria-hidden="true"></i>
                                    </button>
                                    <div class="invalid-feedback" id="erro-senha"></div>
                                </div>
                                <!-- Barra de força da senha -->
                                <div class="progress mt-2" id="forca-progresso" style="height: 6px;" role="progressbar" aria-label="Força da senha" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                    <div class="progress-bar" id="forca-barra"></div>
                                </div>
                                <div class="form-text" id="forca-texto"></div>
                            </div>

                            <!-- Confirmar Senha -->
                            <div class="mb-3">
                                <label for="confirmar" class="form-label">Confirmar senha</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-lock-fill" aria-hidden="true"></i></span>
                                    <input type="password" class="form-control" id="confirmar" name="confirmar" placeholder="Repita a senha" required>
                                    <div class="invalid-feedback" id="erro-confirmar"></div>
                                </div>
                            </div>

                            
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" role="switch" id="novidades" name="novidades">
                                <label class="form-check-label" for="novidades">Receber novidades por e-mail</label>
                            </div>

                            <!-- Termos de uso -->
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="termos" name="termos" required>
                                    <label class="form-check-label" for="termos">Li e aceito os termos de uso</label>
                                    <div class="invalid-feedback" id="erro-termos"></div>
                                </div>
                            </div>

                            <!-- Botão Cadastrar -->
                            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                        </form>

                        <!-- Painel exclusivo de confirmação  -->
                        <div id="painel-sucesso" class="mt-4"></div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    
    <footer>
        <p>&copy; 2026 IngressosFácil - Todos os direitos reservados</p>
    </footer>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
